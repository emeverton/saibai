name: Deploy Saibai mobile fixes interactively

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-saibai-mobile-interactive.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: saibai-mobile-interactive-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SHOPIFY_STORE: byinbz-0k.myshopify.com
      SHOPIFY_THEME_ID: "187189297470"
      SHOPIFY_CLI_NO_ANALYTICS: "1"
      SHOPIFY_FLAG_NO_COLOR: "1"
      BROWSER: echo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Shopify CLI
        run: npm install --global @shopify/cli@latest

      - name: Authenticate and deploy mobile files
        id: deploy
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .deploy
          rm -f .deploy/shopify-auth-active.json
          : > /tmp/shopify-auth-raw.log
          : > /tmp/shopify-push-raw.log

          # Authenticate first. Keeping this as a separate CLI process makes the
          # device-code result explicit before the actual theme upload begins.
          timeout --signal=TERM 900s script -q -f -e -c \
            "env -u CI BROWSER=echo SHOPIFY_CLI_NO_ANALYTICS=1 shopify theme list --store ${SHOPIFY_STORE} --json --no-color" \
            /tmp/shopify-auth-raw.log &
          AUTH_PID=$!

          AUTH_RECORDED=0
          for i in $(seq 1 180); do
            if ! kill -0 "$AUTH_PID" 2>/dev/null; then
              break
            fi

            CODE="$(grep -oE 'User verification code: [A-Z0-9-]+' /tmp/shopify-auth-raw.log 2>/dev/null | tail -n 1 | sed 's/User verification code: //' || true)"
            URL="$(grep -oE 'https://accounts\.shopify\.com/activate-with-code[^[:space:]]+' /tmp/shopify-auth-raw.log 2>/dev/null | tail -n 1 || true)"

            if [ -n "$CODE" ] && [ -n "$URL" ] && [ "$AUTH_RECORDED" -eq 0 ]; then
              NOW="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              jq -n \
                --arg status "awaiting_authorization" \
                --arg generated_at "$NOW" \
                --arg code "$CODE" \
                --arg url "$URL" \
                --arg store "$SHOPIFY_STORE" \
                --arg theme_id "$SHOPIFY_THEME_ID" \
                '{status:$status,generated_at:$generated_at,code:$code,url:$url,store:$store,theme_id:$theme_id}' \
                > .deploy/shopify-auth-active.json

              git add .deploy/shopify-auth-active.json
              git commit -m "chore: expose active Shopify device authorization" || true
              git pull --rebase || true
              git push || true
              AUTH_RECORDED=1
            fi
            sleep 2
          done

          wait "$AUTH_PID"
          AUTH_STATUS=$?

          if [ "$AUTH_STATUS" -eq 0 ]; then
            timeout --signal=TERM 420s script -q -f -e -c \
              "env -u CI SHOPIFY_CLI_NO_ANALYTICS=1 SHOPIFY_FLAG_FORCE=1 shopify theme push --store ${SHOPIFY_STORE} --theme ${SHOPIFY_THEME_ID} --only assets/saibai-mobile-pages.css --only snippets/global-css.liquid --nodelete --json --no-color" \
              /tmp/shopify-push-raw.log
            PUSH_STATUS=$?
          else
            PUSH_STATUS=99
          fi

          sed -E 's/\x1B\[[0-9;?]*[ -\/]*[@-~]//g' /tmp/shopify-auth-raw.log \
            | tr -d '\r' | sed -E 's/[^[:print:]\t]//g' > /tmp/shopify-auth-clean.log
          sed -E 's/\x1B\[[0-9;?]*[ -\/]*[@-~]//g' /tmp/shopify-push-raw.log \
            | tr -d '\r' | sed -E 's/[^[:print:]\t]//g' > /tmp/shopify-push-clean.log

          if [ "$AUTH_STATUS" -eq 0 ] && [ "$PUSH_STATUS" -eq 0 ]; then
            FINAL_STATUS="success"
            EXIT_STATUS=0
          else
            FINAL_STATUS="failure"
            EXIT_STATUS=1
          fi

          NOW="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg status "$FINAL_STATUS" \
            --arg deployed_at "$NOW" \
            --arg store "$SHOPIFY_STORE" \
            --arg theme_id "$SHOPIFY_THEME_ID" \
            --argjson auth_exit_code "$AUTH_STATUS" \
            --argjson push_exit_code "$PUSH_STATUS" \
            --arg auth_output "$(tail -n 30 /tmp/shopify-auth-clean.log)" \
            --arg push_output "$(tail -n 40 /tmp/shopify-push-clean.log)" \
            '{status:$status,deployed_at:$deployed_at,store:$store,theme_id:$theme_id,auth_exit_code:$auth_exit_code,push_exit_code:$push_exit_code,files:["assets/saibai-mobile-pages.css","snippets/global-css.liquid"],auth_output:$auth_output,push_output:$push_output}' \
            > .deploy/saibai-mobile-interactive-result.json

          rm -f .deploy/shopify-auth-active.json
          git add -A .deploy
          git commit -m "chore: record interactive Saibai mobile deploy (${FINAL_STATUS})" || true
          git pull --rebase || true
          git push || true

          exit "$EXIT_STATUS"
