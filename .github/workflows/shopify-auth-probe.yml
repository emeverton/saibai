name: Shopify auth probe

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/shopify-auth-probe.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shopify-auth-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Shopify CLI
        run: npm install --global @shopify/cli@latest

      - name: Probe account authentication
        id: probe
        continue-on-error: true
        shell: bash
        env:
          SHOPIFY_FLAG_STORE: byinbz-0k.myshopify.com
          SHOPIFY_FLAG_NO_COLOR: "1"
          SHOPIFY_CLI_NO_ANALYTICS: "1"
          BROWSER: echo
        run: |
          set +e
          timeout --signal=TERM 150s script -q -e -c \
            "env -u CI BROWSER=echo SHOPIFY_CLI_NO_ANALYTICS=1 shopify theme list --store byinbz-0k.myshopify.com --no-color" \
            /tmp/shopify-auth-raw.log
          STATUS=$?
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"

          sed -E 's/\x1B\[[0-9;?]*[ -\/]*[@-~]//g' /tmp/shopify-auth-raw.log \
            | tr -d '\r' \
            | sed -E 's/[^[:print:]\t]//g' \
            > /tmp/shopify-auth-clean.log

          tail -n 100 /tmp/shopify-auth-clean.log > /tmp/shopify-auth-summary.log

      - name: Record sanitized result
        if: always()
        shell: bash
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          PROBE_EXIT_CODE: ${{ steps.probe.outputs.exit_code }}
        run: |
          mkdir -p .deploy
          NOW="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          {
            echo "status=${PROBE_OUTCOME}"
            echo "exit_code=${PROBE_EXIT_CODE:-unknown}"
            echo "probed_at=${NOW}"
            echo "store=byinbz-0k.myshopify.com"
            echo "---"
            cat /tmp/shopify-auth-summary.log 2>/dev/null || true
          } > .deploy/shopify-auth-probe.txt

          git config user.name "github-actions[bot]"
          git config user.email "418982onoreply.github.com"
          git add .deploy/shopify-auth-probe.txt
          git commit -m "chore: record Shopify auth probe" || exit 0
          git push
